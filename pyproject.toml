[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-tpm-fpkm-converter"
version = "3.0.0"
description = "RNA-Seq TPM, FPKM & RPKM Normalization Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
test = ["pytest>=8.0"]

[project.scripts]
rnaseq-converter = "cli:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_rnaseq_norm.py"]
python_files = ["test_*.py"]
